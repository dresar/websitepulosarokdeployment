<!-- Enhanced Search and Filter -->
<div class="search-filter-container mb-4">
    <div class="row">
        <div class="col-md-4 mb-2">
            <!-- Search Input -->
            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text">
                        <i class="fas fa-search"></i>
                    </span>
                </div>
                <input type="text" class="form-control" id="searchInput" placeholder="Cari data..." autocomplete="off">
                <div class="input-group-append">
                    <button class="btn btn-outline-secondary" type="button" id="clearSearchBtn" title="Hapus pencarian">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-2 mb-2">
            <!-- Status Filter -->
            <select class="form-control" id="statusFilter">
                <option value="">Semua Status</option>
                <option value="active">Aktif</option>
                <option value="inactive">Tidak Aktif</option>
            </select>
        </div>
        <div class="col-md-2 mb-2">
            <!-- Date Filter -->
            <select class="form-control" id="dateFilter">
                <option value="">Semua Tanggal</option>
                <option value="today">Hari Ini</option>
                <option value="week">Minggu Ini</option>
                <option value="month">Bulan Ini</option>
                <option value="year">Tahun Ini</option>
            </select>
        </div>
        <div class="col-md-2 mb-2">
            <!-- Sort By -->
            <select class="form-control" id="sortBy">
                <option value="name">Nama</option>
                <option value="created">Tanggal Dibuat</option>
                <option value="updated">Tanggal Diupdate</option>
                <option value="status">Status</option>
            </select>
        </div>
        <div class="col-md-2 mb-2">
            <!-- Sort Order -->
            <select class="form-control" id="sortOrder">
                <option value="asc">A-Z</option>
                <option value="desc">Z-A</option>
            </select>
        </div>
    </div>
    
    <!-- Advanced Filters -->
    <div class="row mt-2" id="advancedFilters" style="display: none;">
        <div class="col-md-3 mb-2">
            <label class="form-label">Tanggal Mulai:</label>
            <input type="date" class="form-control" id="startDate">
        </div>
        <div class="col-md-3 mb-2">
            <label class="form-label">Tanggal Akhir:</label>
            <input type="date" class="form-control" id="endDate">
        </div>
        <div class="col-md-3 mb-2">
            <label class="form-label">Kategori:</label>
            <select class="form-control" id="categoryFilter">
                <option value="">Semua Kategori</option>
                <!-- Categories will be populated dynamically -->
            </select>
        </div>
        <div class="col-md-3 mb-2">
            <label class="form-label">Jumlah Item:</label>
            <select class="form-control" id="itemCountFilter">
                <option value="">Semua</option>
                <option value="0-10">0-10</option>
                <option value="11-50">11-50</option>
                <option value="51-100">51-100</option>
                <option value="100+">100+</option>
            </select>
        </div>
    </div>
    
    <!-- Filter Actions -->
    <div class="row mt-2">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <button class="btn btn-sm btn-outline-primary" id="toggleAdvancedFilters">
                        <i class="fas fa-filter mr-1"></i>
                        Filter Lanjutan
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" id="resetFilters">
                        <i class="fas fa-undo mr-1"></i>
                        Reset Filter
                    </button>
                    <button class="btn btn-sm btn-outline-info" id="saveFilters">
                        <i class="fas fa-save mr-1"></i>
                        Simpan Filter
                    </button>
                </div>
                <div>
                    <span class="text-muted" id="filterResults">
                        Menampilkan <span id="filteredCount">0</span> dari <span id="totalCount">0</span> item
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Search Suggestions -->
<div class="search-suggestions" id="searchSuggestions" style="display: none;">
    <div class="list-group">
        <!-- Suggestions will be populated dynamically -->
    </div>
</div>

<script>
// Enhanced Search and Filter JavaScript
let searchTimeout;
let currentFilters = {};
let savedFilters = {};

// Initialize search and filter
function initSearchFilter() {
    // Search input with debouncing
    $('#searchInput').on('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function() {
            performSearch();
        }, 300);
    });
    
    // Clear search button
    $('#clearSearchBtn').click(function() {
        $('#searchInput').val('');
        performSearch();
    });
    
    // Filter changes
    $('#statusFilter, #dateFilter, #sortBy, #sortOrder').change(function() {
        applyFilters();
    });
    
    // Advanced filters
    $('#startDate, #endDate, #categoryFilter, #itemCountFilter').change(function() {
        applyFilters();
    });
    
    // Toggle advanced filters
    $('#toggleAdvancedFilters').click(function() {
        $('#advancedFilters').slideToggle();
        $(this).find('i').toggleClass('fa-chevron-down fa-chevron-up');
    });
    
    // Reset filters
    $('#resetFilters').click(function() {
        resetAllFilters();
    });
    
    // Save filters
    $('#saveFilters').click(function() {
        saveCurrentFilters();
    });
    
    // Load saved filters
    loadSavedFilters();
}

// Perform search
function performSearch() {
    const searchTerm = $('#searchInput').val().toLowerCase();
    const suggestions = $('#searchSuggestions');
    
    if (searchTerm.length > 0) {
        // Show search suggestions
        showSearchSuggestions(searchTerm);
    } else {
        suggestions.hide();
    }
    
    applyFilters();
}

// Show search suggestions
function showSearchSuggestions(searchTerm) {
    const suggestions = $('#searchSuggestions');
    const suggestionsList = suggestions.find('.list-group');
    
    // Get suggestions from current data
    const suggestionsData = getSearchSuggestions(searchTerm);
    
    if (suggestionsData.length > 0) {
        suggestionsList.empty();
        suggestionsData.forEach(function(item) {
            suggestionsList.append(`
                <a href="#" class="list-group-item list-group-item-action" onclick="selectSuggestion('${item}')">
                    <i class="fas fa-search mr-2"></i>
                    ${item}
                </a>
            `);
        });
        suggestions.show();
    } else {
        suggestions.hide();
    }
}

// Get search suggestions
function getSearchSuggestions(searchTerm) {
    if (typeof allData === 'undefined') return [];
    
    const suggestions = [];
    const maxSuggestions = 5;
    
    allData.forEach(function(item) {
        if (suggestions.length >= maxSuggestions) return;
        
        // Check if item matches search term
        const itemText = (item.nama || item.name || '').toLowerCase();
        if (itemText.includes(searchTerm)) {
            suggestions.push(item.nama || item.name);
        }
    });
    
    return suggestions;
}

// Select suggestion
function selectSuggestion(suggestion) {
    $('#searchInput').val(suggestion);
    $('#searchSuggestions').hide();
    performSearch();
}

// Apply filters
function applyFilters() {
    const filters = {
        search: $('#searchInput').val().toLowerCase(),
        status: $('#statusFilter').val(),
        date: $('#dateFilter').val(),
        startDate: $('#startDate').val(),
        endDate: $('#endDate').val(),
        category: $('#categoryFilter').val(),
        itemCount: $('#itemCountFilter').val(),
        sortBy: $('#sortBy').val(),
        sortOrder: $('#sortOrder').val()
    };
    
    currentFilters = filters;
    
    // Filter data
    let filteredData = filterData(allData, filters);
    
    // Update display
    updateFilteredDisplay(filteredData);
    
    // Update filter results
    $('#filteredCount').text(filteredData.length);
    $('#totalCount').text(allData.length);
}

// Filter data based on criteria
function filterData(data, filters) {
    return data.filter(function(item) {
        // Search filter
        if (filters.search) {
            const searchFields = ['nama', 'name', 'kode', 'code', 'kepala_dusun', 'kepala_lorong'];
            const matchesSearch = searchFields.some(function(field) {
                return (item[field] || '').toLowerCase().includes(filters.search);
            });
            if (!matchesSearch) return false;
        }
        
        // Status filter
        if (filters.status) {
            const isActive = item.status === 'aktif' || item.is_active === true;
            if (filters.status === 'active' && !isActive) return false;
            if (filters.status === 'inactive' && isActive) return false;
        }
        
        // Date filter
        if (filters.date) {
            const itemDate = new Date(item.created_at || item.created || new Date());
            const now = new Date();
            
            switch (filters.date) {
                case 'today':
                    if (itemDate.toDateString() !== now.toDateString()) return false;
                    break;
                case 'week':
                    const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    if (itemDate < weekAgo) return false;
                    break;
                case 'month':
                    const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                    if (itemDate < monthAgo) return false;
                    break;
                case 'year':
                    const yearAgo = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
                    if (itemDate < yearAgo) return false;
                    break;
            }
        }
        
        // Date range filter
        if (filters.startDate) {
            const startDate = new Date(filters.startDate);
            const itemDate = new Date(item.created_at || item.created || new Date());
            if (itemDate < startDate) return false;
        }
        
        if (filters.endDate) {
            const endDate = new Date(filters.endDate);
            const itemDate = new Date(item.created_at || item.created || new Date());
            if (itemDate > endDate) return false;
        }
        
        // Category filter
        if (filters.category) {
            const itemCategory = item.category || item.kategori || '';
            if (itemCategory !== filters.category) return false;
        }
        
        // Item count filter
        if (filters.itemCount) {
            const itemCount = item.jumlah_penduduk || item.population_count || 0;
            switch (filters.itemCount) {
                case '0-10':
                    if (itemCount > 10) return false;
                    break;
                case '11-50':
                    if (itemCount < 11 || itemCount > 50) return false;
                    break;
                case '51-100':
                    if (itemCount < 51 || itemCount > 100) return false;
                    break;
                case '100+':
                    if (itemCount < 100) return false;
                    break;
            }
        }
        
        return true;
    }).sort(function(a, b) {
        // Sort by selected field
        const sortField = filters.sortBy || 'name';
        const sortOrder = filters.sortOrder || 'asc';
        
        let aValue = a[sortField] || '';
        let bValue = b[sortField] || '';
        
        if (sortField === 'created' || sortField === 'updated') {
            aValue = new Date(a.created_at || a.created || new Date());
            bValue = new Date(b.created_at || b.created || new Date());
        }
        
        if (sortOrder === 'asc') {
            return aValue > bValue ? 1 : -1;
        } else {
            return aValue < bValue ? 1 : -1;
        }
    });
}

// Update filtered display
function updateFilteredDisplay(filteredData) {
    // This function should be implemented in each list page
    // to update the display with filtered data
    if (typeof updateDisplay === 'function') {
        updateDisplay(filteredData);
    }
}

// Reset all filters
function resetAllFilters() {
    $('#searchInput').val('');
    $('#statusFilter').val('');
    $('#dateFilter').val('');
    $('#startDate').val('');
    $('#endDate').val('');
    $('#categoryFilter').val('');
    $('#itemCountFilter').val('');
    $('#sortBy').val('name');
    $('#sortOrder').val('asc');
    
    currentFilters = {};
    applyFilters();
}

// Save current filters
function saveCurrentFilters() {
    savedFilters = { ...currentFilters };
    localStorage.setItem('savedFilters', JSON.stringify(savedFilters));
    showAlert('success', 'Filter berhasil disimpan!');
}

// Load saved filters
function loadSavedFilters() {
    const saved = localStorage.getItem('savedFilters');
    if (saved) {
        try {
            savedFilters = JSON.parse(saved);
            applySavedFilters();
        } catch (e) {
            console.log('Failed to load saved filters');
        }
    }
}

// Apply saved filters
function applySavedFilters() {
    if (Object.keys(savedFilters).length > 0) {
        $('#searchInput').val(savedFilters.search || '');
        $('#statusFilter').val(savedFilters.status || '');
        $('#dateFilter').val(savedFilters.date || '');
        $('#startDate').val(savedFilters.startDate || '');
        $('#endDate').val(savedFilters.endDate || '');
        $('#categoryFilter').val(savedFilters.category || '');
        $('#itemCountFilter').val(savedFilters.itemCount || '');
        $('#sortBy').val(savedFilters.sortBy || 'name');
        $('#sortOrder').val(savedFilters.sortOrder || 'asc');
        
        applyFilters();
    }
}

// Initialize when document is ready
$(document).ready(function() {
    initSearchFilter();
});

// Hide suggestions when clicking outside
$(document).click(function(e) {
    if (!$(e.target).closest('.search-filter-container').length) {
        $('#searchSuggestions').hide();
    }
});
</script>

    position: absolute;
    top: 100%;

    right: 0;
    z-index: 1000;

    border: 1px solid #dee2e6;
    border-top: none;
    border-radius: 0 0 0.375rem 0.375rem;
    box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
}

.search-suggestions .list-group-item {
    border: none;
    border-bottom: 1px solid #dee2e6;

.search-suggestions .list-group-item:last-child {
    border-bottom: none;
}

    background-color: #f8f9fa;
}

    .search-filter-container .d-flex {
        flex-direction: column;
        align-items: flex-start !important;

</style>
