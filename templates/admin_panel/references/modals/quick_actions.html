<!-- Quick Actions Template -->
<!-- Usage: Include this in your table row generation -->
<!-- 
Example usage in JavaScript:
const quickActions = generateQuickActions(item.id, item.nama, {
    viewUrl: '/admin-panel/references/dusun/' + item.id + '/',
    editUrl: '/admin-panel/references/dusun/' + item.id + '/edit/',
    deleteCallback: 'showDeleteModal(' + item.id + ', \'' + item.nama + '\')'
});
-->

<script>
function generateQuickActions(itemId, itemName, options = {}) {
    const defaultOptions = {
        viewUrl: '#',
        editUrl: '#',
        deleteCallback: 'showDeleteModal(' + itemId + ', \'' + itemName + '\')',
        showView: true,
        showEdit: true,
        showDelete: true,
        showToggle: false,
        toggleCallback: 'toggleStatus(' + itemId + ')',
        isActive: true
    };
    
    const config = { ...defaultOptions, ...options };
    
    let actions = '<div class="btn-group btn-group-sm" role="group">';
    
    // View button
    if (config.showView) {
        actions += '<a href="' + config.viewUrl + '" class="btn btn-outline-primary btn-sm" title="Lihat Detail">' +
                   '<i class="fas fa-eye"></i>' +
                   '</a>';
    }
    
    // Edit button
    if (config.showEdit) {
        actions += '<a href="' + config.editUrl + '" class="btn btn-outline-warning btn-sm" title="Edit">' +
                   '<i class="fas fa-edit"></i>' +
                   '</a>';
    }
    
    // Toggle status button
    if (config.showToggle) {
        const toggleClass = config.isActive ? 'btn-outline-secondary' : 'btn-outline-success';
        const toggleIcon = config.isActive ? 'fa-eye-slash' : 'fa-eye';
        const toggleTitle = config.isActive ? 'Nonaktifkan' : 'Aktifkan';
        
        actions += '<button class="btn ' + toggleClass + ' btn-sm" onclick="' + config.toggleCallback + '" title="' + toggleTitle + '">' +
                   '<i class="fas ' + toggleIcon + '"></i>' +
                   '</button>';
    }
    
    // Delete button
    if (config.showDelete) {
        actions += '<button class="btn btn-outline-danger btn-sm" onclick="' + config.deleteCallback + '" title="Hapus">' +
                   '<i class="fas fa-trash"></i>' +
                   '</button>';
    }
    
    actions += '</div>';
    
    return actions;
}

// Quick action functions
function toggleStatus(itemId) {
    if (confirm('Apakah Anda yakin ingin mengubah status item ini?')) {
        // Implement toggle status logic
        $.ajax({
            url: '/admin-panel/references/api/toggle-status/',
            type: 'POST',
            data: {
                'csrfmiddlewaretoken': $('[name=csrfmiddlewaretoken]').val(),
                'item_id': itemId
            },
            success: function(response) {
                if (response.success) {
                    showAlert('success', response.message);
                    location.reload();
                } else {
                    showAlert('danger', 'Error: ' + response.message);
                }
            },
            error: function() {
                showAlert('danger', 'Terjadi kesalahan saat mengubah status.');
            }
        });
    }
}

// Enhanced delete confirmation
function showDeleteModal(itemId, itemName, additionalData = {}) {
    const modalHtml = `
        <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fas fa-exclamation-triangle text-danger mr-2"></i>
                            Konfirmasi Hapus
                        </h5>
                        <button type="button" class="close" data-dismiss="modal">
                            <span>&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="alert alert-danger">
                            <i class="fas fa-warning mr-2"></i>
                            <strong>Peringatan:</strong> Aksi ini tidak dapat dibatalkan!
                        </div>
                        <p>Apakah Anda yakin ingin menghapus <strong>${itemName}</strong>?</p>
                        ${Object.keys(additionalData).length > 0 ? 
                            '<div class="mt-3"><h6>Detail Item:</h6><ul class="list-unstyled">' +
                            Object.entries(additionalData).map(([key, value]) => 
                                `<li><strong>${key}:</strong> ${value}</li>`
                            ).join('') + '</ul></div>' : ''
                        }
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Batal</button>
                        <button type="button" class="btn btn-danger" onclick="confirmDelete(${itemId})">
                            <i class="fas fa-trash mr-1"></i>
                            Ya, Hapus
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Remove existing modal if any
    $('#deleteModal').remove();
    
    // Add new modal
    $('body').append(modalHtml);
    
    // Show modal
    $('#deleteModal').modal('show');
}

function confirmDelete(itemId) {
    // Implement delete logic
    $.ajax({
        url: '/admin-panel/references/api/delete-item/',
        type: 'POST',
        data: {
            'csrfmiddlewaretoken': $('[name=csrfmiddlewaretoken]').val(),
            'item_id': itemId
        },
        success: function(response) {
            if (response.success) {
                showAlert('success', response.message);
                $('#deleteModal').modal('hide');
                location.reload();
            } else {
                showAlert('danger', 'Error: ' + response.message);
            }
        },
        error: function() {
            showAlert('danger', 'Terjadi kesalahan saat menghapus item.');
        }
    });
}
</script>

    padding: 0.25rem 0.5rem;
